# Mosquitto 2.x configuration for AI-Based Smart Traffic Management System
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Standard MQTT TCP listener for Python pipeline
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSockets listener for React Traffic Ops Console (ws://localhost:9001)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
