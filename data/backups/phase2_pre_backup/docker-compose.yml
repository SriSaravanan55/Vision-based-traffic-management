services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: traffic_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_pipeline
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - SDL_VIDEODRIVER=dummy
      - TRAFFIC_DB_PATH=/app/data/traffic_history.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
